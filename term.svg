<style>
  text { font-family:'JetBrains Mono','JetBrains Mono Variable',ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size:14px; fill:#cdd6f4; }
  /* Fail-safe: everything is visible by default. The animation uses
     `backwards` fill to hide each line only while its delay runs, so a
     renderer that ignores CSS animations still shows the full session. */
  .l { animation:reveal .01s steps(1) backwards; }
  @keyframes reveal { from { opacity:0 } to { opacity:1 } }
  #cursor { animation:blink 1.06s steps(1) 1.96s infinite backwards; }
  @keyframes blink { 0% { opacity:0 } 50% { opacity:1 } }
  @media (prefers-reduced-motion:reduce) {
    .l, #cursor { opacity:1; animation:none }
  }
</style>
<defs>
  <linearGradient id="zg" x1="0" y1="0" x2="1" y2="1">
